services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    restart: unless-stopped
    environment:
      server_threads: ${VALHALLA_SERVER_THREADS:-2}
      build_admins: "True"
      build_time_zones: "True"
      build_tar: "True"
      serve_tiles: "True"
    volumes:
      - ./data:/custom_files
    expose:
      - "8002"
    networks:
      - mono-maps-private

  tiles:
    image: maptiler/tileserver-gl:v5.7.0
    restart: unless-stopped
    command:
      - --file
      - /data/iran.pmtiles
      - --bind
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:${TILESERVER_HOST_PORT:-8090}:8080"
    networks:
      - mono-maps-private

networks:
  mono-maps-private:
    name: mono-maps-private
    internal: true
