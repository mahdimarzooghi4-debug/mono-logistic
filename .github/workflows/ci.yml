name: Mono CI

on:
  pull_request:
  push:
    branches:
      - main
      - docs/business-foundation

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Mono.sln
      - name: Build
        run: dotnet build Mono.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test Mono.sln --no-build --configuration Release --logger "trx;LogFileName=mono-tests.trx"
      - name: Build container image
        run: docker build --tag mono-api:ci .
