name: Mono CI

on:
  pull_request:
  push:
    branches:
      - main
      - docs/business-foundation

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Mono.sln
      - name: Build
        run: dotnet build Mono.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test Mono.sln --no-build --configuration Release --logger "trx;LogFileName=mono-tests.trx"
