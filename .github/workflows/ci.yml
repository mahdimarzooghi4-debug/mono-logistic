name: Mono CI

on:
  pull_request:
  push:
    branches:
      - main
      - docs/business-foundation

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mono
          POSTGRES_PASSWORD: mono
          POSTGRES_DB: mono_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mono -d mono_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONO_TEST_DATABASE: Host=localhost;Port=5432;Username=mono;Password=mono;Database=mono_test
      ConnectionStrings__Mono: Host=localhost;Port=5432;Username=mono;Password=mono;Database=mono_test
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Mono.sln
      - name: Build
        run: dotnet build Mono.sln --no-restore --configuration Release
      - name: Validate database migrations
        env:
          ConnectionStrings__Mono: Host=localhost;Port=5432;Username=mono;Password=mono;Database=mono_migration_test
        run: |
          PGPASSWORD=mono createdb --host=localhost --port=5432 --username=mono mono_migration_test
          dotnet run --project tools/Mono.DbMigrator/Mono.DbMigrator.csproj --configuration Release --no-build
          dotnet run --project tools/Mono.DbMigrator/Mono.DbMigrator.csproj --configuration Release --no-build
      - name: Test staging smoke script URL/status handling
        run: bash tools/tests/stage-smoke.test.sh
      - name: Set up Node.js for Operations Console
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Mono.OperationsConsole/package-lock.json
      - name: Build Operations Console for same-origin smoke test
        run: |
          npm ci --prefix src/Mono.OperationsConsole
          npm run build --prefix src/Mono.OperationsConsole
          mkdir -p src/Mono.Api/wwwroot
          cp -R src/Mono.OperationsConsole/dist/. src/Mono.Api/wwwroot/
      - name: Smoke test API health endpoints
        env:
          ConnectionStrings__Mono: Host=localhost;Port=5432;Username=mono;Password=mono;Database=mono_migration_test
        run: |
          dotnet run --project src/Mono.Api/Mono.Api.csproj --configuration Release --no-build -- --urls http://127.0.0.1:5180 > /tmp/mono-api-health.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if tools/stage-smoke.sh http://127.0.0.1:5180; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mono-api-health.log
          exit 1
      - name: Test
        run: dotnet test Mono.sln --no-build --configuration Release --logger "trx;LogFileName=mono-tests.trx"
      - name: Build container image
        run: docker build --tag mono-api:ci .
      - name: Smoke test staging container image
        env:
          ConnectionStrings__Mono: Host=127.0.0.1;Port=5432;Username=mono;Password=mono;Database=mono_container_stage_test
        run: |
          PGPASSWORD=mono createdb --host=localhost --port=5432 --username=mono mono_container_stage_test
          docker run --detach --name mono-container-stage-smoke --network host \
            --env ASPNETCORE_ENVIRONMENT=Staging \
            --env MONO_AUTO_MIGRATE=true \
            --env "ConnectionStrings__Mono=$ConnectionStrings__Mono" \
            mono-api:ci
          trap 'docker rm -f mono-container-stage-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if MONO_STAGE_BASE_URL=http://127.0.0.1:10000 tools/stage-smoke.sh; then
              exit 0
            fi
            sleep 1
          done
          docker logs mono-container-stage-smoke
          exit 1
