name: Mono Merchant Portal

on:
  pull_request:
    paths:
      - 'src/Mono.MerchantPortal/**'
      - '.github/workflows/merchant-portal.yml'
  push:
    branches:
      - main
      - 'sprint-*'
    paths:
      - 'src/Mono.MerchantPortal/**'
      - '.github/workflows/merchant-portal.yml'

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Mono.MerchantPortal/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: src/Mono.MerchantPortal
      - name: Build portal
        run: npm run build
        working-directory: src/Mono.MerchantPortal
