name: Mono Operations Console

on:
  pull_request:
    paths:
      - 'src/Mono.OperationsConsole/**'
      - '.github/workflows/operations-console.yml'
  push:
    branches:
      - main
      - 'sprint-*'
    paths:
      - 'src/Mono.OperationsConsole/**'
      - '.github/workflows/operations-console.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Mono.OperationsConsole/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: src/Mono.OperationsConsole
      - name: Type-check and build
        run: npm run build
        working-directory: src/Mono.OperationsConsole
      - name: Test operations policy workbench
        run: npm test
        working-directory: src/Mono.OperationsConsole
