name: Mono Merchant Mobile

on:
  pull_request:
    paths:
      - 'src/Mono.MerchantMobile/**'
      - '.github/workflows/merchant-mobile.yml'
  push:
    branches:
      - main
      - 'sprint-*'
    paths:
      - 'src/Mono.MerchantMobile/**'
      - '.github/workflows/merchant-mobile.yml'

permissions:
  contents: read

jobs:
  build:
    name: Merchant mobile tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Mono.MerchantMobile/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: src/Mono.MerchantMobile
      - name: Test merchant mobile flows
        run: npm test
        working-directory: src/Mono.MerchantMobile
      - name: Build merchant mobile app
        run: npm run build
        working-directory: src/Mono.MerchantMobile
